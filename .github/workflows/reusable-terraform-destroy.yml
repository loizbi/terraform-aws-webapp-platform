
name: "Reusable: Terraform Destroy"

on:
  workflow_call:
    inputs:
      working_directory:
        required: true
        type: string
      var_file:
        required: true
        type: string
      aws_region:
        required: true
        type: string
      debug:
        required: true
        type: boolean

# Allow the reusable workflow to use OIDC
permissions:
  id-token: write
  contents: read

env:
  AWS_ROLE_ARN: ${{ vars.AWS_APPLY_ROLE_ARN }}

jobs:
  terraform:
    name: Terraform Create Destroy Plan
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy Scan Configuration
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DISABLE_VEX_NOTICE: true
        with:
          tf-vars: ${{ inputs.working_directory }}/${{ inputs.var_file }}
          scan-ref: ${{ inputs.working_directory }}
          scan-type: config
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: GitHubActions
          aws-region: ${{ inputs.aws_region }}
          mask-aws-account-id: true
       
        # Only for debugging purposes
      - name: Verify AWS credentials
        if: ${{ inputs.debug }}
        run: |
          aws sts get-caller-identity
          echo "repo=$GITHUB_REPOSITORY"
          echo "ref=$GITHUB_REF"
          echo "sha=$GITHUB_SHA"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0

      - name: Terraform Init
        run: terraform init

      # Only for debugging purposes      
      #- name: Show backend state
      #  run: terraform state list

      - name: Create Destroy Plan
        env:
          VAR_FILE: ${{ inputs.var_file }}
        run: |
          terraform plan -destroy \
            --var-file="$VAR_FILE" \
            --out=destroy.tfplan
          terraform show -no-color destroy.tfplan
      
      - name: Upload Destroy Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-destroy-plan-${{ github.run_id }}
          path: ${{ inputs.working_directory }}/destroy.tfplan
          retention-days: 1

  destroy:
    name: Terraform Apply Destroy Plan
    needs: terraform
    runs-on: ubuntu-24.04
    # Prevent accidental destruction of resources by restricting this job to the main branch and requiring a manual confirmation input
    environment: production
    defaults:
      run:
        working-directory: ./${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: GitHubActions
          aws-region: ${{ inputs.aws_region }}
          mask-aws-account-id: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0

      - name: Terraform Init
        run: terraform init

      - name: Download Destroy Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-destroy-plan-${{ github.run_id }}
          path: ${{ inputs.working_directory }}

      - name: Terraform Apply
        run: terraform apply -input=false destroy.tfplan