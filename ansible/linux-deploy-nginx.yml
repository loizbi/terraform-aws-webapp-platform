
---
- name: Configure web server
  hosts: linux_ubuntu
  become: true

  tasks:

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install nginx and EC2 utilities
      ansible.builtin.apt:
        name:
          - nginx
          - amazon-ec2-utils
        state: present

    - name: Enable and start nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Get instance ID
      ansible.builtin.command:
        cmd: ec2-metadata --instance-id
      register: instance_id
      changed_when: false

    - name: Get availability zone
      ansible.builtin.command:
        cmd: ec2-metadata --availability-zone --instance-id
      register: availability_zone
      changed_when: false

    - name: Create index page
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: "0644"
        content: |
          <h2>
          Instance ID: {{ instance_id.stdout }}<br>
          Availability Zone: {{ availability_zone.stdout }}
          </h2>