
name: "Terraform: Prod Apply"

on:
  push:
    branches:
      - main
    paths:
      - 'ec2-webapp-example/**'

# Allow the reusable workflow to use OIDC
permissions:
  id-token: write
  contents: read

jobs:
  terraform-deployment:
    uses: ./.github/workflows/reusable-terraform-apply.yml
    with: 
      working_directory: ec2-webapp-example
      var_file: env.tfvars
      aws_region: eu-west-2
      debug: false

    secrets: inherit
