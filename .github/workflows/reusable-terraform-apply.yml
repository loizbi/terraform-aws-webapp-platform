name: "Reusable: Terraform Apply and WebApp Deploy"

on:
  workflow_call:
    inputs:
      working_directory:
        required: true
        type: string
      var_file:
        required: true
        type: string
      aws_region:
        required: true
        type: string
      debug:
        required: true
        type: boolean

    secrets:
      AWS_SSH_PRIVATE_KEY:
        required: true

env:
  AWS_SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}

permissions:
  id-token: write
  contents: read

jobs:
  terraform_plan:
    name: Terraform Plan
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: "./${{ inputs.working_directory }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy Scan Configuration
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DISABLE_VEX_NOTICE: true
        with:
          tf-vars: ${{ inputs.working_directory }}/${{ inputs.var_file }}
          scan-ref: ${{ inputs.working_directory }}
          scan-type: config
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          role-session-name: GitHubActions
          aws-region: ${{ inputs.aws_region }}
          mask-aws-account-id: true

      - name: Verify AWS credentials
        if: ${{ inputs.debug }}
        run: |
          aws sts get-caller-identity
          echo "repo=$GITHUB_REPOSITORY"
          echo "ref=$GITHUB_REF"
          echo "sha=$GITHUB_SHA"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format
        run: terraform fmt -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Create Terraform Plan
        run: terraform plan -input=false -lock-timeout=5m --var-file=${{ inputs.var_file }} -out=tfplan

      - name: Show Terraform Plan
        run: terraform show -no-color tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.run_id }}
          path: ${{ inputs.working_directory }}/tfplan
          retention-days: 1

  terraform_apply:
    name: Apply Approved Terraform Plan
    needs: terraform_plan
    runs-on: ubuntu-24.04
    environment: production

    defaults:
      run:
        working-directory: "./${{ inputs.working_directory }}"

    outputs:
      EC2_PUBLIC_IP: ${{ steps.terraform_output.outputs.EC2_PUBLIC_IP }}
      EC2_SECURITY_GROUP_ID: ${{ steps.terraform_output.outputs.EC2_SECURITY_GROUP_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          role-session-name: GitHubActions
          aws-region: ${{ inputs.aws_region }}
          mask-aws-account-id: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0

      - name: Terraform Init
        run: terraform init

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ github.run_id }}
          path: ${{ inputs.working_directory }}

      - name: Apply Approved Terraform Plan
        run: terraform apply -input=false tfplan

      - name: Get EC2 Public IP and Security Group IDs
        id: terraform_output
        run: |
          EC2_PUBLIC_IP=$(terraform output -json ec2_instance_public_ip | jq -c '.')
          EC2_SECURITY_GROUP_ID=$(terraform output -json ec2_security_group_id | jq -c '.')

          echo "EC2_PUBLIC_IP=$EC2_PUBLIC_IP" >> "$GITHUB_OUTPUT"
          echo "EC2_SECURITY_GROUP_ID=$EC2_SECURITY_GROUP_ID" >> "$GITHUB_OUTPUT"

  ansible:
    name: Ansible Web Deployment
    needs: terraform_apply

    uses: ./.github/workflows/reusable-ansible-linux-webapp.yml

    with:
      target_host: ${{ needs.terraform_apply.outputs.EC2_PUBLIC_IP }}
      security_group_id: ${{ needs.terraform_apply.outputs.EC2_SECURITY_GROUP_ID }}
      aws_region: ${{ inputs.aws_region }}

    secrets: inherit