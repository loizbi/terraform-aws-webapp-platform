
name: "Reusable: Ansible Deploy WebApp"

on:
  workflow_call:
    inputs:
      target_host:
        description: "IP address or hostname"
        required: true
        type: string
      security_group_id:
        description: "Security group ID"
        required: true
        type: string
      aws_region:
        description: "AWS region"
        required: true
        type: string

    secrets:
      AWS_SSH_PRIVATE_KEY:
        required: true

env:
  AWS_SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Reusable Ansible Linux Web Deployment
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Add SSH access from this runner
        id: allow_ssh
        env:
          SECURITY_GROUP_ID: ${{ inputs.security_group_id }}
        run: |
          RUNNER_IP="$(curl -4fsS https://checkip.amazonaws.com)"
          RUNNER_CIDR="${RUNNER_IP}/32"
          echo "runner_cidr=$RUNNER_CIDR" >> "$GITHUB_OUTPUT"

          aws ec2 authorize-security-group-ingress \
            --group-id "$SECURITY_GROUP_ID" \
            --protocol tcp --port 22 --cidr "$RUNNER_CIDR"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Create runtime inventory
        env:
            TARGET_HOST: ${{ inputs.target_host }}
        run: |
          mkdir -p ansible/inventory
          printf '[linux_ubuntu]\n%s\n' "$TARGET_HOST" > ansible/inventory/hosts.ini

      - name: Show inventory
        run: |
          ansible-inventory \
            -i ansible/inventory/hosts.ini \
            --graph

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AWS_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Validate SSH key
        run: |
          ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null

      - name: Deploy Web Application
        env:
          TARGET_HOST: ${{ inputs.target_host }}
        run: |
          ansible-playbook -i ansible/inventory/hosts.ini \
          ansible/linux-deploy-nginx.yml
      
      - name: Remove SSH access for this runner
        if: ${{ always() && steps.allow_ssh.outputs.runner_cidr != '' }}
        env:
          SECURITY_GROUP_ID: ${{ inputs.security_group_id }}
          RUNNER_CIDR: ${{ steps.allow_ssh.outputs.runner_cidr }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$SECURITY_GROUP_ID" \
            --protocol tcp --port 22 --cidr "$RUNNER_CIDR"